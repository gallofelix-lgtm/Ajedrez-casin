<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tragaperras Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        h1 { color: #00e676; margin: 10px 0; font-size: 22px; text-align: center; }
        
        .panel { background: #1e1e1e; padding: 12px; border-radius: 8px; width: 100%; max-width: 350px; margin-bottom: 10px; text-align: center; font-size: 15px; }
        .coins { color: #ffd700; font-weight: bold; }
        
        input, button { padding: 10px; border-radius: 5px; border: none; font-size: 14px; margin: 5px; }
        input { background: #2a2a2a; color: #fff; text-align: center; width: 80px; }
        button { font-weight: bold; cursor: pointer; background: #00e676; color: #000; width: 100%; max-width: 200px; }

        .slot-machine {
            background: #181818;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .reels-container {
            display: flex;
            gap: 10px;
        }

        .reel {
            width: 75px;
            height: 90px;
            background: #fdfbf7;
            color: #111;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: 2px solid #555;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
        }

        #info { color: #00e676; font-weight: bold; margin-top: 10px; text-align: center; min-height: 24px; }
    </style>
</head>
<body>

    <h1>Tragaperras Arcade 🎰</h1>

    <div class="panel">
        Monedas: <span class="coins" id="myCoins">100 🪙</span>
    </div>

    <div class="slot-machine">
        <div>
            <label>Apuesta: </label>
            <input type="number" id="betInput" value="10" min="1">
        </div>

        <div class="reels-container">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">🔔</div>
        </div>

        <button onclick="girarTragaperras()">¡GIRAR! 🎰</button>
    </div>

    <p id="info">¡Haz girar los rodillos y gana premios!</p>

    <script>
        let coins = parseInt(localStorage.getItem('coins')) || 100;
        const symbols = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];

        document.getElementById('myCoins').textContent = `${coins} 🪙`;

        function updateCoins(n) {
            coins += n;
            localStorage.setItem('coins', coins);
            document.getElementById('myCoins').textContent = `${coins} 🪙`;
        }

        function girarTragaperras() {
            let bet = parseInt(document.getElementById('betInput').value);
            
            if (isNaN(bet) || bet <= 0) {
                return alert("⚠️ Introduce una apuesta válida.");
            }
            if (bet > coins) {
                return alert("⚠️ ¡No tienes suficientes monedas!");
            }

            updateCoins(-bet);

            // Generar resultados aleatorios
            let r1 = symbols[Math.floor(Math.random() * symbols.length)];
            let r2 = symbols[Math.floor(Math.random() * symbols.length)];
            let r3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById('reel1').textContent = r1;
            document.getElementById('reel2').textContent = r2;
            document.getElementById('reel3').textContent = r3;

            let infoText = document.getElementById('info');

            if (r1 === r2 && r2 === r3) {
                let premio = bet * 10;
                updateCoins(premio);
                infoText.textContent = `🎉 ¡JACKPOT! ¡Tres iguales! Ganaste ${premio} 🪙`;
                infoText.style.color = '#ffd700';
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                let premio = bet * 2;
                updateCoins(premio);
                infoText.textContent = `✨ ¡Bien! Dos iguales. Ganaste ${premio} 🪙`;
                infoText.style.color = '#00e676';
            } else {
                infoText.textContent = `😢 Mala suerte, prueba otra vez.`;
                infoText.style.color = '#ff5252';
            }
        }
    </script>
</body>
</html>
